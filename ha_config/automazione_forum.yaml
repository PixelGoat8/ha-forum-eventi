# Notifica push mattutina sugli eventi di oggi al Forum/Repower.
# Incolla in Impostazioni > Automazioni > Nuova > ⋮ Modifica in YAML.
# Sostituisci notify.notify con il tuo servizio: un singolo telefono (notify.mobile_app_…)
# o, meglio, un gruppo di notifica con i dispositivi che vuoi (vedi README).
# Prova immediata: ⋮ > Esegui azioni (salta orario e condizioni).
alias: Forum – avviso eventi del giorno
description: Push al mattino se oggi c'è un evento al Forum o al Teatro Repower
mode: single
triggers:
  - trigger: time
    at: "07:30:00"
conditions:
  - condition: state
    entity_id: binary_sensor.forum_evento_oggi
    state: "on"
actions:
  - variables:
      a: "{{ states.sensor.forum_casino_oggi.attributes }}"
      livello: "{{ states('sensor.forum_casino_oggi') }}"
      urgente: "{{ livello in ['alto', 'estremo'] }}"
      emoji: >-
        {{ {'basso': '🟢', 'medio': '🟡', 'alto': '🟠', 'estremo': '🔴'}.get(livello, 'ℹ️') }}
      eventi: |-
        {% for e in a.eventi -%}
        • {{ e.titolo }} — {{ e.venue }}, {{ e.orari | join('/') if e.orari else 'orario n.d.' }}{{ ' (SOLD OUT)' if e.sold_out }}
        {% endfor %}
  - action: notify.notify
    data:
      title: "{{ emoji }} Forum oggi: casino {{ livello }} ({{ a.punteggio }}/100)"
      message: |-
        {{ eventi | trim }}
        {%- if states('sensor.forum_casino_domani') not in ['nessuno', 'unknown', 'unavailable'] %}
        Domani: casino {{ states('sensor.forum_casino_domani') }}.
        {%- endif %}
      data:
        group: forum-eventi
        tag: forum-eventi                    # la notifica nuova sostituisce quella del giorno prima
        url: /lovelace/panoramica            # iOS: pagina da aprire (adatta al percorso della tua dashboard)
        clickAction: /lovelace/panoramica    # Android
        push:
          interruption-level: "{{ 'time-sensitive' if urgente else 'active' }}"   # iOS: supera Full Immersion
        priority: "{{ 'high' if urgente else 'normal' }}"                         # Android
        channel: Forum eventi                # Android: canale dedicato, regolabile dal telefono
