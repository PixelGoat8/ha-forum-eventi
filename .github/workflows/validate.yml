name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # ogni lunedì: avvisa se HA cambia le regole
  workflow_dispatch:

# Node 20 è deprecato su GitHub Actions: anche le action interne di hassfest e HACS girano su Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest aiohttp beautifulsoup4
      - run: pytest -q tests

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
