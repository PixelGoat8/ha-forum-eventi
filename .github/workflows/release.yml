name: Release

# Su ogni tag vX.Y.Z: controlla che coincida con manifest.json e pubblica la release.
# Se la release l'hai già creata dall'interfaccia di GitHub (che crea anche il tag), fa solo il controllo.
# HACS mostra l'aggiornamento in Home Assistant quando esce una nuova release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione tag = versione manifest
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/forum_eventi/manifest.json'))['version'])")
          [ "v$manifest" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME ma manifest $manifest"; exit 1; }
      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME già presente"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
